services:
  - type: web
    name: skillbridge-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: skillbridge-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: "/data/skillbridge.db"
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_MAX
        value: "5"
      - key: RATE_LIMIT_WINDOW
        value: "60"
